name: Build Windows Core

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-pc-windows-msvc

jobs:
  build-dll:
    name: Build omnibox_core.dll (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Build cdylib (release)
        working-directory: core
        run: cargo build --release --target ${{ env.TARGET }} --locked

      - name: Verify DLL exists
        shell: pwsh
        run: |
          $dll = "core/target/${{ env.TARGET }}/release/omnibox_core.dll"
          if (-not (Test-Path $dll)) { throw "DLL 未生成: $dll" }
          $item = Get-Item $dll
          Write-Host "DLL: $($item.FullName)  Size: $([math]::Round($item.Length/1MB,2)) MB"

      # Release 作为跨 workflow 的中转站：固定 tag，重复构建覆盖同名资源。
      - name: "Publish DLL to Release (tag: core-latest)"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: core-latest
          prerelease: true
          overwrite_files: true
          files: core/target/${{ env.TARGET }}/release/omnibox_core.dll
