name: Build Android App

on:
  # 依赖 Build Android Core 成功后自动触发
  workflow_run:
    workflows: ["Build Android Core"]
    types: [completed]
  # 也支持手动触发（需 core-latest Release 中已有 libomnibox_core.so）
  workflow_dispatch:

permissions:
  contents: write

env:
  SO_NAME: libomnibox_core.so

jobs:
  build-apk:
    name: Build omnibox APK (arm64-v8a)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # 从 android_core.yml 发布的 Release 下载 .so（跨 workflow 中转站，同 Windows DLL）
      - name: Download core .so from Release
        run: |
          set -e
          dest=app/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$dest"
          url="https://github.com/${{ github.repository }}/releases/download/core-latest/${{ env.SO_NAME }}"
          echo "下载: $url"
          curl -fL --retry 3 -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o "$dest/${{ env.SO_NAME }}" "$url"
          ls -l "$dest"
          file "$dest/${{ env.SO_NAME }}" | grep -q "ARM aarch64"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/android/app/build/outputs/apk/release/*.apk dist/omnibox-android-arm64.apk
          ls -l dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnibox-android-arm64
          path: dist/omnibox-android-arm64.apk
          retention-days: 30
          if-no-files-found: error

      - name: "Publish APK to Release (tag: app-android-latest)"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          prerelease: true
          overwrite_files: true
          files: dist/omnibox-android-arm64.apk
