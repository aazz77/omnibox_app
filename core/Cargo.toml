[package]
name = "omnibox_core"
version = "0.1.0"
edition = "2021"
description = "OmniBox 桌面版纯 Rust 内核（单 crate cdylib，供 Flutter 通过 FFI 调用；含直播聚合内核 src/live_server；无 Node.js 运行时）"

[lib]
name = "omnibox_core"
crate-type = ["cdylib"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "blocking", "gzip", "brotli", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
urlencoding = "2"
anyhow = "1"
futures = "0.3"
rquickjs = { version = "0.14", features = ["full-async", "parallel"] }
# 加密原语（替代 Node crypto）、DOM（替代 cheerio）
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
ecb = { version = "0.1", features = ["alloc"] }
md-5 = "0.10"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
rsa = "0.9"
rand = "0.8"
scraper = { version = "0.29", features = ["atomic", "deterministic"] }
ego-tree = "0.11.1"
# 音乐 SDK（LX）：加密预处理、字符集转换
cipher = { version = "0.4", features = ["alloc", "block-padding"] }
encoding_rs = "0.8"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
# —— 以下原属 live_server 子 crate，现并入 ——
async-trait = "0.1"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
url = "2"
thiserror = "1"
bytes = "1"
dashmap = "6"
http = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "perf"] }
# 与 reqwest 内部使用的 brotli 9 对齐，避免 7/9 两份
brotli = "9"
flate2 = "1"

[profile.release]
opt-level = 2
strip = true
lto = "fat"
codegen-units = 1
# cdylib 不能用 panic=abort 跨 FFI 边界（会直接终止宿主进程），改 unwind
panic = "unwind"
debug = false
